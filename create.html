<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post a Team Listing · CampusCollab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <a href="index.html" class="logo">CampusCollab</a>
    <nav aria-label="Main navigation">
      <a href="index.html">Open Teams</a>
      <a href="index.html#how-it-works">About</a>
      <a href="create.html" aria-current="page">Post a Listing</a>
    </nav>
  </header>

  <main>
    <h1>Create a Team Listing</h1>
    <p class="subtitle">Publish your project or study group so other students can join your team.</p>

    <section class="form-section" aria-labelledby="form-title">
      <h2 id="form-title">Project &amp; Team Details</h2>

      <form action="#" method="post">
        <label for="title">Project or Group Title</label>
        <input id="title" name="title" type="text" placeholder="e.g. React Study Group" required>

        <label for="email">Leader University Email</label>
        <input id="email" name="email" type="email" placeholder="you@ostimteknik.edu.tr" required>

        <label for="category">Category</label>
        <select id="category" name="category" required>
          <option value="">-- Select a category --</option>
          <option value="course">Course Project</option>
          <option value="hackathon">Hackathon Team</option>
          <option value="study">Study Group</option>
          <option value="startup">Side Project / Startup</option>
        </select>

        <label for="seats">Open Seats Needed (1 to 5)</label>
        <input id="seats" name="seats" type="number" min="1" max="5" value="2" required>

        <label for="deadline">Application Deadline</label>
        <input id="deadline" name="deadline" type="date" required>

        <button type="submit">Publish Listing</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 CampusCollab · MIS 457 Web Based Application Programming</p>
  </footer>

</body>
</html>
